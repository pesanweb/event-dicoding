[versions]
agp = "9.5.1"
compiler = "5.0.9"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
loggingInterceptor = "5.5.1"
